<!doctype html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<title>文字や文章を装飾しよう</title>
	<meta name="description" content="文字の大きさを変える「font-size プロパティ」">
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<h1>猫の一日</h1>
	<h2>ひたすら寝ています</h2>
	<p>
	  猫は一日12〜16時間睡眠を取ると言われています。
	  ただし、熟眠している時間は少なく、殆どが浅い眠りです。
	  物音がするとすぐ目を覚ますのはそのせいなんですね。
	</p>
</body>
</html>
